<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drip Tees</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }
    header {
      padding: 20px;
    }
    header img {
      max-width: 200px;
    }
    .buttons {
      margin: 20px;
    }
    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .canvas-container {
      position: relative;
      width: 300px;
      margin: auto;
    }
    canvas {
      background: #111;
      border: 2px solid #fff;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="Drip Tees Logo">
</header>

<div class="buttons">
  <button onclick="uploadTshirt()">Upload T-Shirt</button>
  <button onclick="uploadDesign()">Upload Design</button>
</div>

<div class="canvas-container">
  <canvas id="canvas" width="300" height="400"></canvas>
</div>

<input type="file" id="tshirtInput" accept="image/*" hidden>
<input type="file" id="designInput" accept="image/*" hidden>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let tshirtImage = null;
  let designImage = null;

  function uploadTshirt() {
    document.getElementById('tshirtInput').click();
  }

  function uploadDesign() {
    document.getElementById('designInput').click();
  }

  document.getElementById('tshirtInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      tshirtImage = new Image();
      tshirtImage.onload = drawCanvas;
      tshirtImage.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('designInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      designImage = new Image();
      designImage.onload = drawCanvas;
      designImage.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function drawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (tshirtImage) {
      ctx.drawImage(tshirtImage, 0, 0, canvas.width, canvas.height);
    }

    if (designImage) {
      ctx.drawImage(designImage, 75, 100, 150, 150);
    }
  }
</script>

</body>
</html>
